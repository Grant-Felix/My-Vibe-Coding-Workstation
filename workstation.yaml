# Vibe Coding Workstation —— 声明（唯一真源）
#
# 借鉴 DeepSeek Harness 的分层组合设计：
#   配置树从**空根**开始，依次叠加若干层，后者覆盖前者。
#   DSH:  空根 → bundles → profile patch → $DSH_HOME patch → --patch
#   本项目: 空根 → 本文件(base) → workstation.local.yaml → --patch <file>
#
# 由此得到两个性质：
#   · 本文件是**可提交的基线**，个人差异放 local（gitignored），不会互相污染
#   · 覆盖是**按 id 定位**的，不依赖位置——加一个服务不会打乱既有覆盖
#
# 检查而不执行：
#   scripts/render.sh --dump     打印组合后的最终声明（不写任何文件）
#   scripts/render.sh --check    校验产物是否与声明一致
#   scripts/render.sh --dry-run  打印将要做的改动

apiVersion: vibecotion/v1

# ── 运行环境要求（借鉴 DSH 的 peer 版本校验）─────────────────────────
# 宁可在渲染前明确报错，也不要到运行时才诡异失败。
# 由 render.sh 校验；不满足时给出可执行的修复建议。
requires:
  podman: ">=5.0"        # Quadlet 的 .pod / .network 支持
  systemd: ">=252"       # Quadlet 用户级生成器

# ── 归属标识 ────────────────────────────────────────────────────────
# 声明式卸载的全部依据：凡带此前缀的产物即本项目所有，其余一律不碰。
prefix: vibecotion

# ── 命名 ────────────────────────────────────────────────────────────
name: Vibe Coding Workstation
domain: vibecotion.wraindrock.com

# ── 路径 ────────────────────────────────────────────────────────────
paths:
  unitRoot: ~/.config/containers/systemd    # 产物：Quadlet 单元
  derivedRoot: ~/.config/vibecotion          # 产物：网关配置与门户

# ── Pod 与入口 ──────────────────────────────────────────────────────
# 决策 D8/D16：对外只有这一个端口，其余都是 Pod 内部端口。
# 9999 > 1024，rootless 可直接绑定，无需特权。
pod:
  name: vibecotion
  publishPort: 9999

# ── 服务 ────────────────────────────────────────────────────────────
# port 一律是 **Pod 内部端口**，不落宿主。
# 每个服务有稳定 id —— 覆盖层按 id 定位，不依赖顺序。
services:
  gateway:
    image: docker.io/library/caddy:2.10-alpine
    port: 9999
    kind: gateway
    config: config/gateway/Caddyfile
    static: config/home

  agent:
    image: localhost/vibecotion-agent:latest
    port: 3080
    build: agent
    secret: true
    volumes:
      - vibecotion-agent-dsh:/home/agent/.dsh
      - vibecotion-agent-data:/home/agent/workspace

  forgejo:
    image: docker.io/codeberg/forgejo:13
    port: 3000
    host: git.${domain}
    volumes:
      - vibecotion-forgejo-data:/data

  opencloud:
    image: docker.io/opencloudeu/opencloud-rolling:8.0.1
    port: 9200
    host: cloud.${domain}
    volumes:
      - vibecotion-opencloud-config:/etc/opencloud
      - vibecotion-opencloud-data:/var/lib/opencloud

  workbench:
    image: docker.io/library/debian:13-slim
    port: 8080
    instances: [dev, test, staging]
    volumes:
      - vibecotion-workbench-{env}:/work

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    # 无内部端口：它只发起**出站**连接，把 Cloudflare 边缘的流量送到网关。
    # 因此不需要端口，也不参与入口路由。
    kind: tunnel
    envFile: ~/.config/vibecotion/cloudflared.env
